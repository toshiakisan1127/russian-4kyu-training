  <polyline points="140,125.4 360,196.3 580,181.7 800,175.4" fill="none" stroke="#8250df" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="140,225.4 360,308.8 580,300.4 800,296.3" fill="none" stroke="#1f883d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
