  <g fill="#8250df"><circle cx="140" cy="125.4" r="3"/><circle cx="360" cy="196.3" r="3"/><circle cx="580" cy="181.7" r="3"/><circle cx="800" cy="175.4" r="3"/></g>
  <g fill="#1f883d"><circle cx="140" cy="225.4" r="3"/><circle cx="360" cy="308.8" r="3"/><circle cx="580" cy="300.4" r="3"/><circle cx="800" cy="296.3" r="3"/></g>
  <g fill="#0969da"><circle cx="140" cy="298.3" r="3"/><circle cx="360" cy="296.3" r="3"/><circle cx="580" cy="287.9" r="3"/><circle cx="800" cy="283.8" r="3"/></g>
