<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">CI performance history</title>
  <desc id="desc">Recent CI duration trend in seconds.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff" stroke="#d0d7de"/>
