name: Finalize pnpm lockfile

on:
  push:
    branches:
      - chore/pnpm-lockfile-frozen-install

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/pnpm-lockfile-frozen-install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Update deployment docs
        run: sed -i 's/pnpm install --no-frozen-lockfile/pnpm install --frozen-lockfile/g' DEPLOYMENT.md

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml DEPLOYMENT.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: lock pnpm dependencies for CI and deploy"
          git push origin HEAD:chore/pnpm-lockfile-frozen-install
