name: Finalize pnpm lockfile

on:
  push:
    branches:
      - chore/pnpm-lockfile-frozen-install

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/pnpm-lockfile-frozen-install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Require frozen lockfile in CI and deployment
        run: |
          sed -i 's/pnpm install --no-frozen-lockfile/pnpm install --frozen-lockfile/g' \
            .github/workflows/ci.yml \
            .github/workflows/deploy-aws.yml \
            DEPLOYMENT.md

      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-lockfile.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/ci.yml .github/workflows/deploy-aws.yml DEPLOYMENT.md .github/workflows/finalize-lockfile.yml
          git commit -m "chore: lock pnpm dependencies for CI and deploy"
          git push origin HEAD:chore/pnpm-lockfile-frozen-install
