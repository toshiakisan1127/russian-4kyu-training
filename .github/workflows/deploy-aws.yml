name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-production
  cancel-in-progress: true

env:
  CDK_STAGE: prod
  CDK_DOMAIN_NAME: russian4kyu-training.com
  CDK_HOSTED_ZONE_NAME: russian4kyu-training.com

jobs:
  plan:
    name: CDK diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-plan-${{ github.run_id }}
          aws-region: ap-northeast-1

      - name: Create CDK diff
        shell: bash
        run: |
          set -o pipefail
          pnpm exec cdk diff --all \
            --method=change-set \
            --no-color \
            -c stage="${CDK_STAGE}" \
            -c domainName="${CDK_DOMAIN_NAME}" \
            -c hostedZoneName="${CDK_HOSTED_ZONE_NAME}" \
            2>&1 | tee cdk-diff.txt

      - name: Add CDK diff to job summary
        shell: bash
        run: |
          {
            echo '## CDK production diff'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo 'Review this exact diff before approving the production deployment.'
            echo
            echo '```text'
            cat cdk-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CDK diff
        uses: actions/upload-artifact@v4
        with:
          name: cdk-diff-${{ github.sha }}
          path: cdk-diff.txt
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_LAST_UPDATED_AT: ${{ github.event.head_commit.timestamp }}
        run: pnpm generate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-deploy-${{ github.run_id }}
          aws-region: ap-northeast-1

      - name: Deploy CDK infrastructure
        run: |
          pnpm exec cdk deploy Russian4KyuHostingStack-prod \
            --require-approval never \
            -c stage="${CDK_STAGE}" \
            -c domainName="${CDK_DOMAIN_NAME}" \
            -c hostedZoneName="${CDK_HOSTED_ZONE_NAME}"

      - name: Deploy non-hashed assets
        env:
          AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME }}
        run: |
          aws s3 sync .output/public "s3://${AWS_BUCKET_NAME}" \
            --delete \
            --exclude "_nuxt/*" \
            --cache-control "no-cache" \
            --only-show-errors

      - name: Deploy hashed assets
        env:
          AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME }}
        run: |
          aws s3 sync .output/public/_nuxt "s3://${AWS_BUCKET_NAME}/_nuxt" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors
