name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-production
  cancel-in-progress: true

env:
  CDK_STAGE: prod
  CDK_DOMAIN_NAME: russian4kyu-training.com
  CDK_HOSTED_ZONE_NAME: russian4kyu-training.com

jobs:
  plan:
    name: CDK diff
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-plan-${{ github.run_id }}
          aws-region: ap-northeast-1

      - name: Create CDK diff
        id: diff
        shell: bash
        run: |
          set +e
          pnpm exec cdk diff --all \
            --method=change-set \
            --fail \
            --no-color \
            -c stage="${CDK_STAGE}" \
            -c domainName="${CDK_DOMAIN_NAME}" \
            -c hostedZoneName="${CDK_HOSTED_ZONE_NAME}" \
            2>&1 | tee cdk-diff.txt
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 1 ]] && grep -Eq 'Number of stacks with differences: [1-9][0-9]*' cdk-diff.txt; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "CDK diff failed with exit code ${status}; refusing to classify it as an infrastructure change." >&2
            exit "$status"
          fi

      - name: Add CDK diff to job summary
        shell: bash
        run: |
          {
            echo '## CDK production diff'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            if [[ "${{ steps.diff.outputs.has_changes }}" == "true" ]]; then
              echo '**Infrastructure changes detected. Production approval is required before CDK deploy.**'
            else
              echo '**No infrastructure changes detected. S3 application deploy will continue automatically.**'
            fi
            echo
            echo '```text'
            cat cdk-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CDK diff
        uses: actions/upload-artifact@v4
        with:
          name: cdk-diff-${{ github.sha }}
          path: cdk-diff.txt
          if-no-files-found: error
          retention-days: 14

  infra-deploy:
    name: Approve and deploy infrastructure
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-infra-${{ github.run_id }}
          aws-region: ap-northeast-1

      - name: Deploy CDK infrastructure
        run: |
          pnpm exec cdk deploy Russian4KyuHostingStack-prod \
            --require-approval never \
            -c stage="${CDK_STAGE}" \
            -c domainName="${CDK_DOMAIN_NAME}" \
            -c hostedZoneName="${CDK_HOSTED_ZONE_NAME}"

  assets-deploy:
    name: Deploy application to S3
    needs:
      - plan
      - infra-deploy
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.infra-deploy.result == 'success' || needs.infra-deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_LAST_UPDATED_AT: ${{ github.event.head_commit.timestamp }}
        run: pnpm generate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-assets-${{ github.run_id }}
          aws-region: ap-northeast-1

      - name: Deploy non-hashed assets
        env:
          AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME }}
        run: |
          aws s3 sync .output/public "s3://${AWS_BUCKET_NAME}" \
            --delete \
            --exclude "_nuxt/*" \
            --cache-control "no-cache" \
            --only-show-errors

      - name: Deploy hashed assets
        env:
          AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME }}
        run: |
          aws s3 sync .output/public/_nuxt "s3://${AWS_BUCKET_NAME}/_nuxt" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors
