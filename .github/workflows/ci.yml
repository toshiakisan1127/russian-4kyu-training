name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Start CI timer
        run: |
          mkdir -p scripts
          date +%s > "${RUNNER_TEMP}/ci-started-at"
          : > "${RUNNER_TEMP}/ci-timings.tsv"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: bash scripts/ci-timing.sh measure "Install dependencies" pnpm install --frozen-lockfile

      - name: Synthesize CDK
        run: bash scripts/ci-timing.sh measure "CDK synth" pnpm exec cdk synth -c accountId=111111111111

      - name: Generate static site
        run: |
          bash scripts/ci-timing.sh measure "Generate static site" \
            env NUXT_PUBLIC_LAST_UPDATED_AT="$(git log -1 --format=%cI)" pnpm generate

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: bash scripts/ci-timing.sh measure "Playwright system dependencies" pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-timing.sh measure "Playwright Chromium" pnpm exec playwright install chromium

      - name: Browser smoke tests
        run: bash scripts/ci-timing.sh measure "Browser smoke tests" pnpm test:smoke

      - name: CI timing summary
        if: always()
        run: bash scripts/ci-timing.sh summary
